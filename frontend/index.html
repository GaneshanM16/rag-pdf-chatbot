<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF Q&A Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3148;
      --accent: #6c63ff; --accent2: #a78bfa; --text: #e2e8f0; --muted: #94a3b8;
      --success: #34d399; --danger: #f87171; --bot-bubble: #1e2235; --radius: 12px;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    header .logo { font-size: 22px; }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .badge { margin-left: auto; font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .badge.online { color: var(--success); border-color: var(--success); }
    .layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; overflow-y: auto; }
    .sidebar h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 20px 16px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .upload-area:hover, .upload-area.drag { border-color: var(--accent); background: rgba(108,99,255,0.05); }
    .upload-area .icon { font-size: 28px; margin-bottom: 8px; }
    .upload-area p { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .upload-area strong { color: var(--accent2); }
    #fileInput { display: none; }
    .upload-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .upload-btn:hover { opacity: 0.85; } .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .doc-list { display: flex; flex-direction: column; gap: 8px; }
    .doc-item { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
    .doc-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clear-btn { background: transparent; border: 1px solid var(--border); color: var(--danger); border-radius: 8px; padding: 8px; font-size: 12px; cursor: pointer; transition: background 0.2s; }
    .clear-btn:hover { background: rgba(248,113,113,0.1); }
    .status-msg { font-size: 12px; padding: 8px 12px; border-radius: 8px; text-align: center; }
    .status-msg.success { background: rgba(52,211,153,0.1); color: var(--success); }
    .status-msg.error   { background: rgba(248,113,113,0.1); color: var(--danger); }
    .status-msg.loading { background: rgba(108,99,255,0.1); color: var(--accent2); }
    .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
    .msg { display: flex; gap: 10px; max-width: 780px; animation: fadeUp 0.25s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .msg.user .avatar { background: var(--accent); }
    .msg.bot  .avatar { background: var(--surface2); border: 1px solid var(--border); }
    .bubble { padding: 12px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.65; max-width: 640px; }
    .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot  .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .sources { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .source-tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: rgba(108,99,255,0.12); color: var(--accent2); border: 1px solid rgba(108,99,255,0.3); }
    .typing-indicator span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin: 0 2px; animation: bounce 1.2s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); text-align: center; padding: 40px; }
    .empty-state .big-icon { font-size: 52px; }
    .empty-state h3 { font-size: 18px; color: var(--text); }
    .empty-state p  { font-size: 14px; max-width: 320px; line-height: 1.6; }
    .input-bar { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; background: var(--surface); flex-shrink: 0; }
    #questionInput { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 14px; color: var(--text); resize: none; height: 46px; max-height: 140px; outline: none; transition: border-color 0.2s; font-family: inherit; }
    #questionInput:focus { border-color: var(--accent); }
    #questionInput::placeholder { color: var(--muted); }
    #sendBtn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 18px; font-size: 18px; cursor: pointer; transition: opacity 0.2s; flex-shrink: 0; }
    #sendBtn:hover { opacity: 0.85; } #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
<header>
  <div class="logo">🤖</div>
  <div><h1>PDF Q&amp;A Chatbot</h1><p>Powered by LangChain · FastAPI · OpenAI</p></div>
  <div class="badge online">● Online</div>
</header>
<div class="layout">
  <aside class="sidebar">
    <div><h2>📄 Upload PDFs</h2></div>
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📂</div>
      <p>Drag &amp; drop a PDF or<br><strong>click to browse</strong></p>
      <input type="file" id="fileInput" accept=".pdf" multiple />
    </div>
    <button class="upload-btn" id="uploadBtn" disabled>Upload Selected File</button>
    <div id="uploadStatus"></div>
    <div><h2>📚 Documents</h2></div>
    <div class="doc-list" id="docList"><p style="font-size:13px;color:var(--muted)">No documents yet.</p></div>
    <button class="clear-btn" onclick="clearDocs()">🗑 Clear All Documents</button>
  </aside>
  <main class="chat-area">
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="big-icon">💬</div>
        <h3>Ask anything about your PDFs</h3>
        <p>Upload one or more PDFs on the left, then ask questions about them here.</p>
      </div>
    </div>
    <div class="input-bar">
      <textarea id="questionInput" placeholder="Ask a question about your documents…" rows="1"></textarea>
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </main>
</div>
<script>
  const SESSION_ID = "session_" + Math.random().toString(36).slice(2);
  let selectedFile = null, hasMessages = false;
  const fileInput = document.getElementById("fileInput");
  const uploadBtn = document.getElementById("uploadBtn");
  const uploadArea = document.getElementById("uploadArea");
  fileInput.addEventListener("change", () => { selectedFile = fileInput.files[0]; if (selectedFile) { uploadBtn.textContent = `Upload "${selectedFile.name}"`; uploadBtn.disabled = false; } });
  uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("drag"); });
  uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("drag"));
  uploadArea.addEventListener("drop", e => { e.preventDefault(); uploadArea.classList.remove("drag"); const f = e.dataTransfer.files[0]; if (f?.name.endsWith(".pdf")) { selectedFile = f; uploadBtn.textContent = `Upload "${f.name}"`; uploadBtn.disabled = false; } });
  uploadBtn.addEventListener("click", async () => {
    if (!selectedFile) return;
    setStatus("loading", `Uploading & indexing "${selectedFile.name}"…`); uploadBtn.disabled = true;
    const form = new FormData(); form.append("file", selectedFile);
    try {
      const res = await fetch("/upload", { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Upload failed");
      setStatus("success", `✅ ${data.message} (${data.chunks_created} chunks)`);
      selectedFile = null; uploadBtn.textContent = "Upload Selected File"; fileInput.value = ""; loadDocs();
    } catch (err) { setStatus("error", "❌ " + err.message); uploadBtn.disabled = false; }
  });
  function setStatus(type, msg) { document.getElementById("uploadStatus").innerHTML = `<div class="status-msg ${type}">${msg}</div>`; }
  async function loadDocs() {
    try {
      const res = await fetch("/documents"); const data = await res.json();
      const list = document.getElementById("docList");
      list.innerHTML = data.documents.length ? data.documents.map(d => `<div class="doc-item"><span>📄</span><span title="${d}">${d}</span></div>`).join("") : `<p style="font-size:13px;color:var(--muted)">No documents yet.</p>`;
    } catch {}
  }
  async function clearDocs() { if (!confirm("Clear all documents?")) return; await fetch("/documents", { method: "DELETE" }); loadDocs(); setStatus("success", "✅ Knowledge base cleared."); }
  const messagesEl = document.getElementById("messages");
  const questionInput = document.getElementById("questionInput");
  const sendBtn = document.getElementById("sendBtn");
  questionInput.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  questionInput.addEventListener("input", () => { questionInput.style.height = "46px"; questionInput.style.height = Math.min(questionInput.scrollHeight, 140) + "px"; });
  async function sendMessage() {
    const q = questionInput.value.trim(); if (!q) return;
    if (!hasMessages) { document.getElementById("emptyState")?.remove(); hasMessages = true; }
    appendMsg("user", q); questionInput.value = ""; questionInput.style.height = "46px"; sendBtn.disabled = true;
    const tid = appendTyping();
    try {
      const res = await fetch("/chat", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ question: q, session_id: SESSION_ID }) });
      const data = await res.json(); removeTyping(tid);
      if (!res.ok) throw new Error(data.detail || "Error");
      appendMsg("bot", data.answer, data.sources);
    } catch (err) { removeTyping(tid); appendMsg("bot", "⚠️ " + err.message); }
    finally { sendBtn.disabled = false; questionInput.focus(); }
  }
  function appendMsg(role, text, sources=[]) {
    const div = document.createElement("div"); div.className = `msg ${role}`;
    const srcHtml = sources.length ? `<div class="sources">${sources.map(s=>`<span class="source-tag">📄 ${s}</span>`).join("")}</div>` : "";
    div.innerHTML = `<div class="avatar">${role==="user"?"🧑":"🤖"}</div><div class="bubble">${escHtml(text)}${srcHtml}</div>`;
    messagesEl.appendChild(div); messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function appendTyping() {
    const id = "t" + Date.now(); const div = document.createElement("div"); div.className = "msg bot"; div.id = id;
    div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(div); messagesEl.scrollTop = messagesEl.scrollHeight; return id;
  }
  function removeTyping(id) { document.getElementById(id)?.remove(); }
  function escHtml(t) { return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
  loadDocs();
</script>
</body>
</html>
